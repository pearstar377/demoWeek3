<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Demo</title>
</head>
<!--recipe for strawberry cheese cake
make two lists, an unordered list for ingredients, and an ordered list for steps 
-->
<body>
    <h1>Strawberry Cheese Cake</h1>
    <h2>Ingredients</h2>
    <ul>
        <li>Fresh Strawberries</li>
        <li>Cream Cheese</li>
        <li>Whip Cream</li>
        <li>Graham Crackers</li>
        <li><a href="https://www.google.com">Vanilla Extract</a></li>
    </ul>
    <h2>Preparations</h2>
    <ol>
        <li>Preheat the oven 350F</li>
        <li>Crush Strawberries</li>
        <li>Crush the Graham Crackers</li>
        <li>Mix Cream cheese with strawberries</li>
    </ol>  
</body>
</html>
